name: Backfill signal scans

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-04-27"
      end_date:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-05-11"

permissions:
  contents: write

jobs:
  backfill-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Yahoo cache
        uses: actions/cache@v4
        with:
          path: .puddle_yf_cache
          key: yahoo-cache-backfill-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            yahoo-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill signal CSV files
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"

          current="$START"
          while [ "$(date -d "$current" +%Y%m%d)" -le "$(date -d "$END" +%Y%m%d)" ]; do
            echo "Backfilling $current"
            python puddle_rsi_signal_scanner.py \
              --date "$current" \
              --cache-max-hours 0 \
              --request-pause 2
            current=$(date -I -d "$current + 1 day")
          done

      - name: Commit backfilled signal CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal_scans/*.csv

          if git diff --cached --quiet; then
            echo "No backfilled CSV changes to commit."
          else
            git commit -m "Backfill signal scan CSV files"
            git push
          fi
