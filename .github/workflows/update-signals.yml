name: Update signal scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Yahoo cache
        uses: actions/cache@v4
        with:
          path: .puddle_yf_cache
          key: yahoo-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            yahoo-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: |
          python puddle_rsi_signal_scanner.py --cache-max-hours 18 --request-pause 2

      - name: Commit updated signal CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_scans/*.csv
          if git diff --cached --quiet; then
            echo "No signal CSV changes to commit."
          else
            git commit -m "Update daily signal scan"
            git push
          fi
